<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="hero">
    <div class="content">

        <h1>Expense Tracker</h1>

        <div class="nav">
            <a href="{{ url_for('add') }}">Add Expense</a>
            <a href="{{ url_for('summary') }}">Summary</a>
        </div>

        <!-- CLEAR ALL BUTTON (shown only if expenses exist) -->
        {% if expenses %}
        <form action="{{ url_for('clear') }}" method="post"
              onsubmit="return confirm('Are you sure you want to clear all expenses?');">
            <button type="submit" class="clear-btn">Clear All</button>
        </form>
        {% endif %}

        <!-- EXPENSE TABLE -->
        {% if expenses %}
        <table>
            <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Description</th>
                <th>Amount</th>
            </tr>
            {% for e in expenses %}
            <tr>
                <td>{{ e[1] }}</td>
                <td>{{ e[2] }}</td>
                <td>{{ e[3] }}</td>
                <td>{{ e[4] }}</td>
            </tr>
            {% endfor %}
        </table>
        {% else %}
            <p class="no-data">No expenses added yet.</p>
        {% endif %}

    </div>
</div>

</body>
</html>
